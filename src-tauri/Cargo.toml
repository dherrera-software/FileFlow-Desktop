[package]
name = "fileflow-desktop"
version = "0.1.0"
description = "Conversor local de archivos"
authors = ["you"]
edition = "2024"

[lib]
name = "fileflow_desktop_lib"
# En desarrollo de escritorio en Windows solo necesitas "rlib" (evita compilar 3 formatos de librería cada vez)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
encoding_rs = "0.8.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Imágenes y SVG
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
resvg = { version = "0.49.0", default-features = false }
ico = "0.6"

# PDF (nota: pdf-extract ya usa lopdf por debajo)
lopdf = "0.34"
pdf-extract = "0.12.1"

# Excel (calamine ya lee .xls, .xlsx, .xlsm, .xlsb y .ods nativamente)
calamine = "0.38.0"
rust_xlsxwriter = "0.102.0"

# HTML, XML y Markdown
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ego-tree = "0.10"
image-webp = "0.2"
roxmltree = "0.20"
quick-xml = "0.42.0"
scraper = "0.22"

# Datos estructurados
yaml-rust2 = "0.13"

# Compilación ultrarrápida en desarrollo (evita que cargo check y tauri dev saturen la RAM)
[profile.dev]
opt-level = 0
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
